{% load static %}
<!doctype html>
<html>
<head>
    <script src="{% static 'js/sse.js' %}"> </script>
    <link rel="stylesheet" href="{% static 'css/common.css' %}"></link>
    <link rel="stylesheet" href="{% static 'css/mcq.css' %}"></link>
</head>

<style>
#flex {
    display: flex;
    flex-direction: row;
}

.multi-choice div {
    margin: 2vh 0;
}

.multi-choice label {
    padding: 2.5vh 8vh;
}

#meme {
    margin-left: 5vh;
    width: 40vh;
    height: 40vh;
}
</style>

<body class="wide-body fixed-height">
    <div class = "content shimmer">
        <div class="question-container">
            <p class="question-title">{{ question.prompt }}</p>
        </div>
        <div id="flex">
            <form action="" method="post">
                {% csrf_token %}
                {{ form }}
            </form>
            {% if question.image %}
            <img id="meme" src="{% get_media_prefix %}{{ question.image }}"</img>
            {% endif %}
        </div>
    </div>
</body>
</html>
