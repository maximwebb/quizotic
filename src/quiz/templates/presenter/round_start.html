{% load static %}
<!doctype html>
<html>
<head>
    <script src="{% static 'js/sse.js' %}"> </script>
    <link rel="stylesheet" href="{% static 'css/common.css' %}"></link>
</head>
<style>
#flex {
    display: flex;
    flex-direction: column;
}

#meme {
    margin-left: 5vh;
    width: 40vh;
    height: 40vh;
}
</style>

<body class="wide-body fixed-height">
    <div id="flex" class="content shimmer">
        <p id="welcome-title" class="title">ROUND {{game.round_num|add:1}}: {{round_name}}</p>
        {% if image %}
        <img id="meme" src="{% get_media_prefix %}{{ image }}"</img>
        {% endif %}
    </div>
</body>
</html>
