{% load static %}
<link rel="stylesheet" href="{% static 'css/team_list.css' %}"></link>
<div class="team-card-list">

{% if cur_team %}
{% include "teams/team_card.html" with is_cur_team=True team=cur_team %}
<p class="std-text">Your competition:</p>
{% endif %}

{% for team in teams %}
    {% if team != cur_team %}
        {% include "teams/team_card.html" with is_cur_team=False %}
    {% endif %}
{% endfor %}
</div>
