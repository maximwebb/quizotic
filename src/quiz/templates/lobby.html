{% load static %}
<!doctype html>
<html>
<head>
    <script src="{% static 'js/sse.js' %}"> </script>
    <link rel="stylesheet" href="{% static 'css/common.css' %}"></link>
    <link rel="stylesheet" href="{% static 'css/lobby.css' %}"></link>
</head>

<body class="std-body var-height">
    <div class="content shimmer">
        <p id="welcome-title" class="title-2">Welcome team {{ cur_team.team_name }} </p>
	    <h2>Your team leader is {{ cur_team.team_leader }} </h2>
	    <div id="team-list">
	    	{% include "teams/list.html" %}
	    </div>
        <a href="{% url 'team_profile' game.code %}">Edit profile</a>
    </div>
</body>

<script>
sse.addEventListener("update", async (e) => {
	let ev = JSON.parse(e.data);
	if (ev.type == "teams") {
		await refreshTeamsList();
	}
	else {
		console.log(`Got unrecognised event type: ${ev.type}`);
	}
});


const refreshTeamsList = async () => {
    const res = await fetch("/teams/list/{{game_code}}");
	const html = await res.text();

	document.querySelector("#team-list").innerHTML = html;
};

refreshTeamsList();

</script>
</html>
