{% load static %}
<!doctype html>
<html>
<head>
    <script src="{% static 'js/sse.js' %}"> </script>
    <link rel="stylesheet" href="{% static 'css/common.css' %}"></link>
    <link rel="stylesheet" href="{% static 'css/textbox.css' %}"></link>
</head>

<body class="{% if is_presenter %}wide-body{% else %}std-body{% endif %} fixed-height">
    <div class = "content shimmer">
        <div class="question-container">
            <p class="question-title">{{ question.prompt }}</p>
        </div>
        {% if not is_presenter %}
        <form action="" method="post">
            {% csrf_token %}
            {{ form }}
                <input type="submit" value="Submit" class="btn cartoon-shadow"> </input>
        </form>
        {% endif %}
    </div>
</body>
</html>
