{% load static %}
<!doctype html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'css/common.css' %}"></link>
    <link rel="stylesheet" href="{% static 'css/index.css' %}"></link>
</head>
<body>
    <div id="content" class="shimmer">
        <p class="title">WELCOME TO QUIZ</p>
        <form action="" method="post">
            {% csrf_token %}
            <div class="game-code">
                {% for i in "123456" %}
                    <input type="text" maxlength="1">
                {% endfor %}
                <input type="hidden" name="game_code" id="game-code-value">
            </div>
            <input type="submit" value="JOIN ROOM" class="btn">
        </form>
    </div>
</body>
<script>
const inputs = [
    ...document.querySelectorAll('.game-code input:not([type=hidden])')
];
const hidden = document.getElementById('game-code-value');

function update() {
    hidden.value = inputs.map(input => input.value).join('');
}

inputs[0].focus();

inputs.forEach((input, i) => {
    input.addEventListener('input', () => {
        input.value = input.value.toUpperCase().replace(/[^A-Z]/g, '');

        if (input.value && i < inputs.length - 1) {
            inputs[i + 1].focus();
        }

        update();
    });

    input.addEventListener('keydown', event => {
        if (event.key === 'ArrowLeft' && i > 0) {
            event.preventDefault();
            inputs[i - 1].focus();
        }

        if (event.key === 'ArrowRight' && i < inputs.length - 1) {
            event.preventDefault();
            inputs[i + 1].focus();
        }

        if (event.key === 'Backspace' && !input.value && i > 0) {
            event.preventDefault();
            inputs[i - 1].value = '';
            inputs[i - 1].focus();
            update();
        }
    });

    input.addEventListener('paste', event => {
        event.preventDefault();

        const code = event.clipboardData
            .getData('text')
            .toUpperCase()
            .replace(/[^A-Z]/g, '')
            .slice(0, inputs.length);

        code.split('').forEach((char, j) => {
            inputs[j].value = char;
        });

        inputs[Math.min(code.length, inputs.length - 1)].focus();
        update();
    });
});
</script></html>
