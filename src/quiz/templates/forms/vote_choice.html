{% load static %}
<div class="team-card">
    <label for="{{ widget.value.instance.id }}" >
        {% if widget.value.instance.profile_pic %}
        <img class="profile-pic" src="{% get_media_prefix %}{{ widget.value.instance.profile_pic }}" />
        {% else %}
        <p class="profile-pic-alt">{{widget.value.instance.team_name|slice:"0:2"|upper}}</p>
        {% endif %}
        <input
            id="{{ widget.value.instance.id }}" 
            type="{{ widget.type }}"
            name="{{ widget.name }}"
            value="{{ widget.value|stringformat:'s' }}"
            class="multi-choice"
            {% if widget.selected %}checked{% endif %}
        />
        {{ widget.value.instance.team_name }}
    </label>
</div>
