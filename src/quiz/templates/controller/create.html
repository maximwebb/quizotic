{% load static %}
<!doctype html>
<html>
    <body>
        <h1>Create Game</h1>

        <h4>Upload new quiz</h4>
	    <form action="" method="post" enctype="multipart/form-data">
	    	{% csrf_token %}
	    	{{ form }}
	    	<input type="submit" value="Create" class="btn cartoon-shadow"></input>
	    </form>

        <h4>or select from existing:</h4>
        <ul>
        {% for quiz in quiz_list %}
        <form action="" method="post">
            {% csrf_token %}
            <li><button type="submit" name="quiz_id" value="{{quiz.id}}">{{ quiz.name }}</button></li>
        </form>
        {% endfor %}
        </ul>
    </body>
</html>
