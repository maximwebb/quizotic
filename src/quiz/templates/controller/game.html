{% load static %}
<!doctype html>
<html>
<head>
    <script src="{% static 'js/sse.js' %}"> </script>
    <link rel="stylesheet" href="{% static 'css/common.css' %}"></link>
    <link rel="stylesheet" href="{% static 'css/controller/index.css' %}"></link>
</head>
<body class="std-body var-height">
    <div class="content">
    <p class="title-3">Game Control Panel {{ game.code }}</p>
	
	<div id = "nav">
	    <div id = "game-state">
	    </div>
        <div id="nav-inner">
		    <button onclick="prev()" id="prev-btn" class="btn">Prev</button>
		    <button onclick="next()" id="next-btn" class="btn">Next</button>
        </div>
		<button onclick="reset()" id="reset-btn" class="btn-small">Reset</button>
	</div>
    <a id="marking-btn" class="btn-small" href="{% url 'controller_marking' game.code %}">Mark submissions</a>
	<div id = "team-list">
		{% include "../teams/list.html" %}
	</div>
	{% csrf_token %}
    </div>
</body>

<script>
const fetch_with_csrf = async (endpoint, fields={}) => { 
	const csrf = document.querySelector("input").value;

	if (!fields.hasOwnProperty("headers")) {
		fields["headers"] = {};
	}

	fields["headers"]["X-CSRFToken"] = csrf;
	fields["mode"] = "same-origin";

	return await fetch(endpoint, fields);
}

const refreshGameState = async () => {
	const gameState = await fetch_with_csrf("{% url 'controller_game_state' game.code %}").then(r => r.text());
    const gamePos = await fetch_with_csrf("{% url 'controller_game_position' game.code %}").then(r => r.json());
    console.log(gamePos);
    console.log(gamePos["next"]);
	
	document.querySelector("#game-state").innerHTML = gameState;
    document.querySelector("#next-btn").innerHTML = `${gamePos["next"]} ➡️`;
    document.querySelector("#prev-btn").innerHTML = `⬅️ ${gamePos["prev"]}`;
}

const refreshTeamList = async () => {
    const res = await fetch("/teams/list/{{game.code}}");
	const html = await res.text();
	document.querySelector("#team-list").innerHTML = html;
};

setInterval(refreshTeamList, 5000);

refreshTeamList();
refreshGameState();

const next = async () => {
	const resp = await fetch_with_csrf("{% url 'game_action' game.code 'next' %}", {
		method: "POST",
	});

	refreshGameState();
}

const prev = async () => {
	const resp = await fetch_with_csrf("{% url 'game_action' game.code 'prev' %}", {
		method: "POST",
	});

	refreshGameState();
}

const reset = async () => {
	const resp = await fetch_with_csrf("{% url 'game_action' game.code 'reset' %}", {
		method: "POST",
	});

	refreshGameState();
}

</script>
<html>
